<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplink · Shelter phone</title>
<style>
:root{--ink:#1d1d1b;--muted:#6b6a64;--line:#e3e1da;--bg:#f5f4f0;--ok:#2f8f4e;--bad:#c23b3b;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:440px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ask{border:2px solid var(--warn);animation:ring 1s ease-in-out infinite alternate}
@keyframes ring{from{box-shadow:0 0 0 0 #b7791f33}to{box-shadow:0 0 0 8px #b7791f00}}
.ask h2{margin:0 0 4px;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:600 17px system-ui;padding:14px;border-radius:12px;border:none;cursor:pointer;color:#fff}
.yes{background:var(--ok)}.no{background:var(--bad)}
.part{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.part input{width:70px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px}
.part .some{flex:1;background:var(--warn);font-size:15px;padding:10px}
.meta{color:var(--muted);font-size:14px}
.bar{height:6px;background:#eee;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--warn)}
.status{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e3f3e8;color:var(--ok)}
.status.full{background:#fbe5e5;color:var(--bad)}
.list div{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.empty{color:var(--muted);font-style:italic;font-size:14px}
.vbar{display:flex;gap:8px;margin-bottom:14px}
.vbar button,.mic{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;padding:10px 12px}
.vbar button.on{background:var(--ink);color:#fff}
.mic{width:100%;margin-top:10px}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:ring 0.8s ease-in-out infinite alternate}
.heard{font-size:14px;margin-top:8px;color:var(--muted);min-height:1em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Shelter phone</h1>
  <p class="sub">Uplink shelter phone. You're answering for this shelter. When the agents pick it, the request shows up here.</p>
  <select id="pick"></select>
  <div class="vbar"><button id="vt">🔈 Voice off</button><span class="meta" id="vnote">Turn on to hear requests and answer out loud.</span></div>
  <div id="asks"></div>
  <div class="card"><h3>On the way</h3><div class="list" id="coming"></div></div>
  <div class="card"><h3>Received today</h3><div class="list" id="got"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let id = new URLSearchParams(location.search).get("id") || "harbor-house";
let lastAsks = "";

$("pick").onchange = e => { id = e.target.value; history.replaceState(null, "", "?id=" + id); lastAsks = ""; poll(); };

async function respond(donation, accept, servings){
  await fetch("/api/shelter/respond", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({donation, accept, servings})});
  lastAsks = ""; poll();
}

async function poll(){
  const r = await fetch("/api/shelter/" + id);
  const s = await r.json();
  hasEleven = !!s.voice;
  if(!$("pick").options.length || $("pick").options.length !== s.options.length){
    $("pick").innerHTML = s.options.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("");
  }
  $("pick").value = id;
  if(!r.ok) return;
  const n = s.nonprofit;
  $("title").innerHTML = `${esc(n.name)} <span class="status ${n.full?"full":""}">${n.full?"full":"open until "+n.open_until}</span>`;
  const askKey = s.asks.map(a => a.donation).join(",");
  const html = s.asks.map(a => `
    <div class="card ask">
      <h2>New donation request</h2>
      <div><b>${a.food.servings} servings</b> of ${esc(a.food.items.join(", "))}</div>
      <div class="meta">${esc(a.food.category)}${a.food.needs_cold?", must stay cold":""}${a.food.allergens.length?" · contains "+esc(a.food.allergens.join(", ")):""}</div>
      <div class="meta">From ${esc(a.business)} · ${esc(a.driver)} arriving ${a.arrive} · safe for ${a.minutes_left} more min</div>
      <div class="bar"><i style="width:${Math.max(0, 100 - 100*a.waiting/a.timeout)}%"></i></div>
      <div class="meta">The agents try elsewhere if you don't answer in ${Math.max(0, a.timeout - a.waiting)} min.</div>
      <div class="row"><button class="yes" onclick="respond('${a.donation}', true)">Accept all ${a.food.servings}</button>
      <button class="no" onclick="respond('${a.donation}', false)">We're full</button></div>
      <div class="part"><span>Or take only</span><input type="number" id="n-${a.donation}" min="1" max="${a.food.servings - 1}" value="${Math.max(1, Math.floor(a.food.servings/2))}">
      <button class="some" onclick="respond('${a.donation}', true, +document.getElementById('n-${a.donation}').value)">Take part</button></div>
      <button class="mic" id="mic-${a.donation}" onclick="answerByVoice('${a.donation}')">🎤 Answer by voice</button>
      <div class="heard" id="heard-${a.donation}"></div>
    </div>`).join("");
  if(askKey !== lastAsks){
    if(askKey && !lastAsks && navigator.vibrate) navigator.vibrate([200, 100, 200]);
    $("asks").innerHTML = html; lastAsks = askKey;
    s.asks.forEach(a => { if(!announced.has(a.donation)){ announced.add(a.donation); announce(a.donation); } });
  }
  $("coming").innerHTML = s.coming.map(c => `<div><b>${c.servings}</b> · ${esc(c.items)}<br><span class="meta">${esc(c.driver)}, ETA ${c.eta}</span></div>`).join("") || `<p class="empty">Nothing on the way.</p>`;
  $("got").innerHTML = s.received.map(g => `<div><b>${g.servings}</b> · ${esc(g.items)} from ${esc(g.donor)} at ${g.delivered}</div>`).join("") || `<p class="empty">Nothing yet.</p>`;
}
// ---- Voice: the dispatcher reads each request aloud (ElevenLabs), the shelter answers out loud ----
let voiceOn = false, hasEleven = false, rec = null;
const announced = new Set();
$("vt").onclick = () => {
  voiceOn = !voiceOn;
  $("vt").textContent = voiceOn ? "🔊 Voice on" : "🔈 Voice off"; $("vt").classList.toggle("on", voiceOn);
  $("vnote").textContent = voiceOn ? (hasEleven ? "Requests are read aloud. Tap 🎤 and say yes, no, or a number." : "Browser voice (no ElevenLabs key on the server).") : "Turn on to hear requests and answer out loud.";
  if(voiceOn) document.querySelectorAll(".ask .mic").forEach(b => announce(b.id.slice(4)));
};
function sayLocal(text){ if(!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; speechSynthesis.speak(u); }
async function announce(donation){
  if(!voiceOn) return;
  const r = await fetch(`/api/shelter/${id}/ask_text?donation=${encodeURIComponent(donation)}`);
  if(!r.ok) return;
  const {text} = await r.json();
  if(hasEleven){
    const a = new Audio(`/api/tts?who=Dispatch&text=${encodeURIComponent(text)}`);
    a.play().catch(() => sayLocal(text)); a.onerror = () => sayLocal(text);
  } else sayLocal(text);
}
async function sendAnswer(donation, form){
  form.append("donation", donation);
  const out = $("heard-" + donation);
  if(out) out.textContent = "Listening back…";
  const r = await fetch("/api/shelter/voice", {method:"POST", body:form});
  const j = await r.json().catch(() => ({}));
  const heard = j.heard ? `Heard: “${j.heard}”. ` : "";
  if(out) out.textContent = heard + (r.ok ? (j.accept ? (j.servings ? `Taking ${j.servings}.` : "Accepted.") : "Declined.") : (j.error || "Try again."));
  if(r.ok) setTimeout(() => { lastAsks = ""; poll(); }, 1200);
}
async function answerByVoice(donation){
  const btn = $("mic-" + donation);
  if(rec && rec.state === "recording"){ rec.stop(); return; }
  if(!hasEleven){   // no key: use the browser's own speech recognition if it has one
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ $("heard-" + donation).textContent = "Voice answers need an ElevenLabs key or Chrome. Tap a button instead."; return; }
    const sr = new SR(); sr.lang = "en-US"; btn.classList.add("rec"); btn.textContent = "Listening…";
    sr.onresult = e => { const f = new FormData(); f.append("text", e.results[0][0].transcript); sendAnswer(donation, f); };
    sr.onend = () => { btn.classList.remove("rec"); btn.textContent = "🎤 Answer by voice"; };
    sr.start(); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ $("heard-" + donation).textContent = "Microphone blocked. Allow it in the browser (it only works on localhost or https)."; return; }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("rec"); btn.textContent = "🎤 Answer by voice";
    const type = rec.mimeType || "audio/webm";
    const f = new FormData(); f.append("audio", new Blob(chunks, {type}), type.includes("mp4") ? "answer.mp4" : "answer.webm");
    sendAnswer(donation, f);
  };
  rec.start(); btn.classList.add("rec"); btn.textContent = "⏹ Tap when done (stops in 6 s)";
  setTimeout(() => { if(rec && rec.state === "recording") rec.stop(); }, 6000);
}

poll(); setInterval(poll, 1000);
</script>
</body>
</html>
